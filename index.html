<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三国塔防 · Tower of Three Kingdoms</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>
<body>
<div id="app">

  <!-- 主菜单 -->
  <section id="screen-menu" class="screen active">
    <div class="menu-bg"></div>
    <div id="loading"><div class="load-track"><div id="load-bar"></div></div><p>正在调兵遣将…</p></div>
    <div id="menu-inner" class="hide">
      <h1 class="game-title">三国塔防</h1>
      <p class="game-sub">TOWER OF THREE KINGDOMS</p>
      <button id="btn-start" class="big-btn">进入乱世</button>
      <button id="btn-help" class="help-btn">📖 武将图鉴</button>
      <p class="menu-tip">50 关史诗战役 · 12 名将积分召唤上阵 · 势力羁绊相生相克</p>
    </div>
    <button id="btn-mute" class="mute-btn">🔊</button>
  </section>

  <!-- 选关 -->
  <section id="screen-levels" class="screen">
    <h2 class="screen-title">选择关卡</h2>
    <button id="btn-help2" class="help-btn">📖 武将图鉴</button>
    <div id="level-grid"></div>
  </section>

  <!-- 战斗 -->
  <section id="screen-battle" class="screen">
    <div id="hud">
      <span class="hud-item" id="hud-level">第 1 关</span>
      <span class="hud-item">⚡ <b id="hud-gold">0</b></span>
      <span class="hud-item">❤️ <b id="hud-lives">0</b></span>
      <span class="hud-item">🌊 <b id="hud-wave">0/0</b></span>
      <span class="hud-spacer"></span>
      <span id="hud-synergy" class="hud-synergy" title="势力羁绊"></span>
      <button id="btn-help3" class="hud-btn">📖 图鉴</button>
      <button id="speed-btn" class="hud-btn">×1</button>
      <button id="quit-btn" class="hud-btn">退出</button>
    </div>

    <div id="stage-wrap">
      <div id="stage"></div>
      <div id="toast"></div>

      <div id="build-wheel"></div>
      <div id="upgrade-panel"></div>

      <button id="wave-btn" class="wave-btn">▶ 出兵</button>

      <div id="result">
        <div class="result-box">
          <h2 id="result-title"></h2>
          <p id="result-sub"></p>
          <div id="tech-choice"></div>
          <div class="result-btns">
            <button id="result-next" class="big-btn">下一关 ▶</button>
            <button id="result-retry" class="mid-btn">再战</button>
            <button id="result-menu" class="mid-btn">返回</button>
          </div>
        </div>
      </div>
    </div>
  </section>

</div>

<!-- 图鉴说明弹窗 -->
<div id="help-modal">
  <div class="help-box">
    <div class="help-head">
      <div class="help-tabs">
        <button class="help-tab active" data-tab="hero">⚔️ 武将图鉴</button>
        <button class="help-tab" data-tab="enemy">👹 怪物图鉴</button>
        <button class="help-tab" data-tab="synergy">🤝 势力羁绊</button>
      </div>
      <button id="help-close">✕</button>
    </div>
    <div class="help-tip">击杀怪物获得积分（积分 = 怪物分值 × 关卡难度），用积分召唤武将上阵、并为其升星强化。同势力武将齐上阵触发羁绊增益，部分武将同场会内耗削弱。</div>
    <div id="help-grid"></div>
  </div>
</div>

<script src="js/heroes.js?v=4"></script>
<script src="js/enemies.js?v=4"></script>
<script src="js/levels.js?v=4"></script>
<script src="js/tech.js?v=4"></script>
<script src="js/synergy.js?v=4"></script>
<script src="js/assets.js?v=4"></script>
<script src="js/audio.js?v=4"></script>
<script src="js/ui.js?v=4"></script>
<script src="js/game.js?v=4"></script>
<script src="js/main.js?v=4"></script>
</body>
</html>
